<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>BankSim - Transactions</title>
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
    <div id="wrapper">
        <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="index.html">
                <div class="sidebar-brand-icon"><i class="fas fa-university"></i></div>
                <div class="sidebar-brand-text mx-3">BankSim</div>
            </a>
            <hr class="sidebar-divider my-0">
            <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-fw fa-tachometer-alt"></i><span>Dashboard</span></a></li>
            <li class="nav-item active"><a class="nav-link" href="transactions.html"><i class="fas fa-fw fa-table"></i><span>Transactions</span></a></li>
            <li class="nav-item"><a class="nav-link" href="loans.html"><i class="fas fa-fw fa-money-bill"></i><span>Loans</span></a></li>
            <li class="nav-item"><a class="nav-link" href="currency.html"><i class="fas fa-fw fa-exchange-alt"></i><span>Currency Exchange</span></a></li>
        </ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item dropdown no-arrow">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                                <span class="mr-2 d-none d-lg-inline text-gray-600 small" id="userFullName">Loading...</span>
                                <img class="img-profile rounded-circle" src="img/undraw_profile.svg">
                            </a>
                            <div class="dropdown-menu dropdown-menu-right shadow" aria-labelledby="userDropdown">
                                <a class="dropdown-item" href="login.html" id="logoutBtn"><i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>Logout</a>
                            </div>
                        </li>
                    </ul>
                </nav>

                <!-- Main Content -->
                <div class="container-fluid">
                    <h1 class="h3 mb-4 text-gray-800">Transaction History</h1>
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">All Transactions</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" width="100%" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>Type</th>
                                            <th>Amount (KES)</th>
                                            <th>Balance After (KES)</th>
                                            <th>Date</th>
                                        </tr>
                                    </thead>
                                    <tbody id="transactionTableBody">
                                        <tr><td colspan="4" class="text-center">Loading...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto"><span>BankSim &copy; 2026</span></div>
                </div>
            </footer>
        </div>
    </div>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', async function() {
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'login.html'; return; }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
        });

        const response = await fetch('http://localhost:5113/api/Dashboard/transactions', {
            headers: { 'Authorization': 'Bearer ' + token }
        });

        const tbody = document.getElementById('transactionTableBody');

        if (response.ok) {
            const transactions = await response.json();
            if (transactions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">No transactions yet</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            transactions.forEach(tx => {
                const typeColor = tx.type === 'Deposit' ? 'text-success' : 'text-danger';
                tbody.innerHTML += `
                    <tr>
                        <td class="${typeColor} font-weight-bold">${tx.type}</td>
                        <td>KES ${tx.amount.toFixed(2)}</td>
                        <td>KES ${tx.balanceAfter.toFixed(2)}</td>
                        <td>${new Date(tx.createdAt).toLocaleDateString()}</td>
                    </tr>`;
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Failed to load transactions</td></tr>';
        }
    });
    </script>
</body>
</html>
