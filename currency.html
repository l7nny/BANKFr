<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>BankSim - Currency Exchange</title>
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
    <div id="wrapper">
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="index.html">
                <div class="sidebar-brand-icon"><i class="fas fa-university"></i></div>
                <div class="sidebar-brand-text mx-3">BankSim</div>
            </a>
            <hr class="sidebar-divider my-0">
            <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-fw fa-tachometer-alt"></i><span>Dashboard</span></a></li>
            <li class="nav-item"><a class="nav-link" href="transactions.html"><i class="fas fa-fw fa-table"></i><span>Transactions</span></a></li>
            <li class="nav-item"><a class="nav-link" href="loans.html"><i class="fas fa-fw fa-money-bill"></i><span>Loans</span></a></li>
            <li class="nav-item active"><a class="nav-link" href="currency.html"><i class="fas fa-fw fa-exchange-alt"></i><span>Currency Exchange</span></a></li>
        </ul>

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item dropdown no-arrow">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                                <span class="mr-2 d-none d-lg-inline text-gray-600 small" id="userFullName">Loading...</span>
                                <img class="img-profile rounded-circle" src="img/undraw_profile.svg">
                            </a>
                            <div class="dropdown-menu dropdown-menu-right shadow" aria-labelledby="userDropdown">
                                <a class="dropdown-item" href="login.html" id="logoutBtn"><i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>Logout</a>
                            </div>
                        </li>
                    </ul>
                </nav>

                <div class="container-fluid">
                    <h1 class="h3 mb-4 text-gray-800">Currency Exchange</h1>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Convert Currency</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-3">
                                    <select id="fromCurrency" class="form-control mb-3">
                                        <option value="">From Currency</option>
                                        <option value="KES">KES - Kenyan Shilling</option>
                                        <option value="USD">USD - US Dollar</option>
                                        <option value="EUR">EUR - Euro</option>
                                        <option value="GBP">GBP - British Pound</option>
                                        <option value="UGX">UGX - Ugandan Shilling</option>
                                        <option value="TZS">TZS - Tanzanian Shilling</option>
                                        <option value="ZAR">ZAR - South African Rand</option>
                                        <option value="NGN">NGN - Nigerian Naira</option>
                                        <option value="CNY">CNY - Chinese Yuan</option>
                                        <option value="JPY">JPY - Japanese Yen</option>
                                        <option value="AED">AED - UAE Dirham</option>
                                        <option value="INR">INR - Indian Rupee</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <select id="toCurrency" class="form-control mb-3">
                                        <option value="">To Currency</option>
                                        <option value="KES">KES - Kenyan Shilling</option>
                                        <option value="USD">USD - US Dollar</option>
                                        <option value="EUR">EUR - Euro</option>
                                        <option value="GBP">GBP - British Pound</option>
                                        <option value="UGX">UGX - Ugandan Shilling</option>
                                        <option value="TZS">TZS - Tanzanian Shilling</option>
                                        <option value="ZAR">ZAR - South African Rand</option>
                                        <option value="NGN">NGN - Nigerian Naira</option>
                                        <option value="CNY">CNY - Chinese Yuan</option>
                                        <option value="JPY">JPY - Japanese Yen</option>
                                        <option value="AED">AED - UAE Dirham</option>
                                        <option value="INR">INR - Indian Rupee</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <input type="number" id="convertAmount" class="form-control mb-3" placeholder="Amount">
                                </div>
                                <div class="col-md-3">
                                    <button id="convertBtn" class="btn btn-primary btn-block">Convert</button>
                                </div>
                            </div>
                            <div id="convertResult" class="mt-2 h5 font-weight-bold text-success"></div>
                        </div>
                    </div>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Exchange History</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" width="100%" cellspacing="0">
                                    <thead>
                                        <tr><th>From</th><th>To</th><th>Amount</th><th>Converted</th><th>Rate</th><th>Date</th></tr>
                                    </thead>
                                    <tbody id="exchangeHistory">
                                        <tr><td colspan="6" class="text-center">No exchanges yet</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto"><span>BankSim &copy; 2026</span></div>
                </div>
            </footer>
        </div>
    </div>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', async function() {
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'login.html'; return; }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
        });

        async function loadHistory() {
            const response = await fetch('http://localhost:5113/api/Currency/history', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const tbody = document.getElementById('exchangeHistory');
            if (response.ok) {
                const history = await response.json();
                if (history.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No exchanges yet</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                history.forEach(ex => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${ex.fromCurrency}</td>
                            <td>${ex.toCurrency}</td>
                            <td>${ex.amount.toFixed(2)}</td>
                            <td>${ex.convertedAmount.toFixed(2)}</td>
                            <td>${ex.exchangeRate.toFixed(4)}</td>
                            <td>${new Date(ex.createdAt).toLocaleDateString()}</td>
                        </tr>`;
                });
            }
        }

        loadHistory();

        document.getElementById('convertBtn').addEventListener('click', async function() {
            const fromCurrency = document.getElementById('fromCurrency').value;
            const toCurrency = document.getElementById('toCurrency').value;
            const amount = parseFloat(document.getElementById('convertAmount').value);

            if (!fromCurrency || !toCurrency || !amount || amount <= 0) {
                alert('Please fill in all fields'); return;
            }
            if (fromCurrency === toCurrency) {
                alert('Please select different currencies'); return;
            }

            const response = await fetch('http://localhost:5113/api/Currency/convert', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ fromCurrency, toCurrency, amount })
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById('convertResult').textContent =
                    `${data.amount} ${data.from} = ${data.convertedAmount.toFixed(2)} ${data.to} (Rate: ${data.rate.toFixed(4)})`;
                loadHistory();
            } else {
                alert('Conversion failed — please try again');
            }
        });
    });
    </script>
</body>
</html>
